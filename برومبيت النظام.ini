## 1️⃣3️⃣ توحيد تصميم لوحة التحكم

- تأكد أن جميع ملفات `dashboard/*.php` تبدأ بـ `include 'header.php'` و`include 'sidebar.php'` و`include 'footer.php'` بنفس المسار.
- قم بتوحيد ملفات `dashboard/header.php` و`dashboard/sidebar.php` و`dashboard/footer.php` لتشمل نفس CSS/JS.
- في `moveuser.php` اعرض حركات المستخدمين (مثل إضافة منتج للمفضلة، إضافة للسلة، كتابة تعليق) عبر جداول `logs` أو عبر جلب البيانات من الجداول الموجودة.

---

## 1️⃣4️⃣ ضبط زر السلة والمفضلة لكل المنتجات (حتى عند نفاد الكمية)

في دالة `renderProductCard` أعلاه، استخدمنا `$cart_disabled` التي تعطل الزر عندما `$stock <= 0`. ويظهر أيضاً نص "غير متوفر".

لجعل المنتج "للعرض فقط" وعدم إمكانية مشاركته أو إضافته للمفضلة عند نفاد الكمية، يمكن إضافة `disable` على أزرار المشاركة والمفضلة أيضاً.

