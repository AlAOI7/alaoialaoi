## 1️⃣1️⃣ البحث الذكي (AJAX)

إنشاء ملف `search_ajax.php`:

```php
<?php
include 'config.php';
$q = $_GET['q'] ?? '';
$stmt = $conn->prepare("SELECT id, name, price FROM products WHERE name LIKE ? OR description LIKE ? LIMIT 10");
$like = "%$q%";
$stmt->bind_param("ss", $like, $like);
$stmt->execute();
$result = $stmt->get_result();
$output = '<ul class="list-group">';
while($row = $result->fetch_assoc()) {
    $output .= '<li class="list-group-item"><a href="product-details.php?id='.$row['id'].'">'.$row['name'].' - '.$row['price'].'</a></li>';
}
$output .= '</ul>';
echo $output;
?>
```

ثم في أي صفحة (مثل `header.php`) أضف `input` مع jQuery:

```js
$('#search-input').on('keyup', function() {
    $.get('search_ajax.php', {q: this.value}, function(data) {
        $('#search-results').html(data);
    });
});
```

