## 1️⃣2️⃣ المنتجات الرائجة (الأكثر مبيعاً)

افترض وجود جدول `order_items` يحوي `product_id` و`quantity`. لعرض الأكثر مبيعاً:

```sql
SELECT p.*, SUM(oi.quantity) as total_sold
FROM products p
JOIN order_items oi ON p.id = oi.product_id
GROUP BY p.id
ORDER BY total_sold DESC
LIMIT 10
```

لعرض الأكثر مشاهدة: أضف عمود `views` في جدول `products` وزده كلما زار المستخدم صفحة التفاصيل.














