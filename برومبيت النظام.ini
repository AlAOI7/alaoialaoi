## 3️⃣ صورة المنتج الاحتياطية (شعار الموقع)

في `getProductImages` أعلاه، استخدمت `$settings['site_logo']`.  
لضبط ذلك: أضف جدول `settings`:

```sql
CREATE TABLE IF NOT EXISTS `settings` (
  `id` int(11) NOT NULL AUTO_INCREMENT,
  `setting_key` varchar(100) NOT NULL,
  `setting_value` text,
  PRIMARY KEY (`id`),
  UNIQUE KEY `key` (`setting_key`)
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
```

أدخل القيم الافتراضية:

```sql
INSERT INTO `settings` (`setting_key`, `setting_value`) VALUES
('site_name', 'متجري'),
('site_logo', 'assets/images/logo.png'),
('site_favicon', 'assets/images/favicon.ico'),
('footer_text', 'جميع الحقوق محفوظة'),
('currency', 'YER'),
('exchange_rate_usd', '1250'),
('exchange_rate_sar', '330'),
('contact_email', 'info@mysite.com'),
('contact_phone', '123456789'),
('address', 'صنعاء - اليمن');
```

ثم في `footer.php` استدع `getSettings()` لعرض المعلومات.

في `index.php` لتغيير الخلفية، أضف متغير CSS أو صورة من الإعدادات:

```php
<?php $settings = getSettings(); ?>
<style>
  body { background-image: url('<?= $settings['background_image'] ?? 'default-bg.jpg' ?>'); }
</style>
```

