## 8️⃣ نظام العملات والتسعير

أضف جدول `exchange_rates`:

```sql
CREATE TABLE `exchange_rates` (
  `id` int NOT NULL AUTO_INCREMENT,
  `from_currency` varchar(10) NOT NULL,
  `to_currency` varchar(10) NOT NULL,
  `rate` decimal(10,4) NOT NULL,
  `updated_at` timestamp NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
  PRIMARY KEY (`id`)
);
```

في `products` أضف أعمدة الأسعار:

```sql
ALTER TABLE `products` 
ADD `price_old_yearly` decimal(10,2) DEFAULT NULL COMMENT 'سعر العمله اليمني القديم',
ADD `price_new_yearly` decimal(10,2) DEFAULT NULL COMMENT 'سعر العمله اليمني الجديد',
ADD `price_sar` decimal(10,2) DEFAULT NULL,
ADD `price_usd` decimal(10,2) DEFAULT NULL,
ADD `discount` int DEFAULT 0;
```

**عند عرض السعر** استخدم العملة المختارة من الملف الشخصي (`profile.php`) أو من الإعدادات العامة.

إنشاء صفحة تسعير `pricing.php` في لوحة التحكم لتعديل سعر الصرف، ثم تحديث جميع أسعار المنتجات تلقائياً بناءً على السعر الأساسي بالعملة اليمنية الجديدة.

> نظراً لطول الشرح، يمكنني إعطاؤك ملف كامل `pricing.php` عند الطلب.

