## 2️⃣ توحيد عرض المنتجات في كل مكان (واجهات أمامية)

سننشئ **دالة واحدة** تولد كرت المنتج بشكل موحد، تتضمن:  
- الصورة (كبيرة) + صورة احتياطية (شعار الموقع)  
- علامة "مميز" إذا كان المنتج مميزاً  
- الكمية المتبقية (إذا صفر تظهر "غير متوفر" ولا يمكن إضافة للسلة)  
- الأيقونات (سلة، مشاركة، مفضلة)  
- التقييم (نجوم من 5)  
- الاسم، الفئة، السعر (بعملتين إذا وجدت)، الوصف المختصر

### أضف هذه الدالة في ملف `functions.php` (أنشئه إذا لم يكن موجوداً)

```php
<?php
// functions.php

function getProductImages($product_id) {
    global $conn;
    $images = [];
    $query = "SELECT image_path FROM product_images WHERE product_id = ? ORDER BY is_primary DESC";
    $stmt = $conn->prepare($query);
    $stmt->bind_param("i", $product_id);
    $stmt->execute();
    $res = $stmt->get_result();
    while($row = $res->fetch_assoc()) {
        $images[] = $row['image_path'];
    }
    if(empty($images)) {
        // صورة افتراضية: شعار الموقع من الإعدادات
        $settings = getSettings();
        $images[] = $settings['site_logo'] ?? 'assets/images/default-logo.png';
    }
    return $images;
}

function getProductRating($product_id) {
    global $conn;
    $avg = 0;
    $query = "SELECT AVG(rating) as avg_rating FROM reviews WHERE product_id = ? AND status=1";
    $stmt = $conn->prepare($query);
    $stmt->bind_param("i", $product_id);
    $stmt->execute();
    $res = $stmt->get_result();
    if($row = $res->fetch_assoc()) {
        $avg = round($row['avg_rating'], 1);
    }
    return $avg;
}

function renderStars($rating) {
    $html = '<div class="product-rating">';
    $full = floor($rating);
    $half = ($rating - $full) >= 0.5 ? 1 : 0;
    for($i=1;$i<=5;$i++) {
        if($i <= $full) $html .= '<i class="fas fa-star text-warning"></i>';
        elseif($half && $i == $full+1) $html .= '<i class="fas fa-star-half-alt text-warning"></i>';
        else $html .= '<i class="far fa-star text-muted"></i>';
    }
    $html .= ' <span class="rating-count">(' . number_format($rating,1) . ')</span>';
    $html .= '</div>';
    return $html;
}

function renderProductCard($product) {
    global $conn, $settings;
    $id = $product['id'];
    $name = htmlspecialchars($product['name']);
    $price = number_format($product['price'], 2);
    $old_price = isset($product['old_price']) ? number_format($product['old_price'],2) : '';
    $category = htmlspecialchars($product['category_name'] ?? '');
    $description = htmlspecialchars(substr($product['description'], 0, 80));
    $stock = (int)$product['quantity'];
    $is_featured = $product['featured'] ?? 0;
    $images = getProductImages($id);
    $main_image = $images[0];
    $rating = getProductRating($id);
    $currency = $settings['currency'] ?? 'YER';
    $currency_symbol = getCurrencySymbol($currency);
    
    $out_of_stock = ($stock <= 0);
    $cart_disabled = $out_of_stock ? 'disabled' : '';
    $stock_text = $out_of_stock ? '<span class="badge bg-danger">غير متوفر</span>' : '<span class="badge bg-success">المتبقي: '.$stock.'</span>';
    
    $html = '<div class="col-md-4 col-sm-6 mb-4 product-card">';
    $html .= '<div class="card h-100 shadow-sm">';
    // الصورة
    $html .= '<div class="product-img-wrapper" style="height: 250px; overflow:hidden;">';
    $html .= '<img src="'.htmlspecialchars($main_image).'" class="card-img-top" style="width:100%; height:100%; object-fit:cover;" alt="'.$name.'">';
    $html .= '</div>';
    // علامة مميز
    if($is_featured) {
        $html .= '<span class="badge bg-warning position-absolute top-0 start-0 m-2">مميز</span>';
    }
    // الكمية
    $html .= '<div class="stock-badge position-absolute top-0 end-0 m-2">'.$stock_text.'</div>';
    
    $html .= '<div class="card-body d-flex flex-column">';
    $html .= '<h5 class="card-title">'.$name.'</h5>';
    $html .= '<p class="card-text small text-muted">'.$category.'</p>';
    $html .= renderStars($rating);
    // السعر
    $html .= '<div class="price-box mt-2">';
    if($old_price) {
        $html .= '<del class="text-muted me-2">'.$old_price.' '.$currency_symbol.'</del>';
    }
    $html .= '<strong class="text-primary">'.$price.' '.$currency_symbol.'</strong>';
    $html .= '</div>';
    $html .= '<p class="card-text small mt-2">'.$description.'</p>';
    
    // أزرار الإجراءات
    $html .= '<div class="mt-auto d-flex justify-content-between align-items-center">';
    $html .= '<button class="btn btn-sm btn-outline-primary add-to-cart" data-id="'.$id.'" '.$cart_disabled.'><i class="fas fa-cart-plus"></i> أضف للسلة</button>';
    $html .= '<button class="btn btn-sm btn-outline-danger add-to-favorite" data-id="'.$id.'"><i class="fas fa-heart"></i></button>';
    $html .= '<button class="btn btn-sm btn-outline-secondary share-product" data-name="'.$name.'" data-url="product-details.php?id='.$id.'"><i class="fas fa-share-alt"></i></button>';
    $html .= '</div>';
    $html .= '</div>'; // end card-body
    $html .= '</div>'; // end card
    $html .= '</div>'; // end col
    
    return $html;
}

function getSettings() {
    global $conn;
    static $settings = [];
    if(empty($settings)) {
        $res = $conn->query("SELECT setting_key, setting_value FROM settings");
        while($row = $res->fetch_assoc()) {
            $settings[$row['setting_key']] = $row['setting_value'];
        }
    }
    return $settings;
}

function getCurrencySymbol($code) {
    $symbols = ['YER'=>'﷼', 'SAR'=>'ر.س', 'USD'=>'$'];
    return $symbols[$code] ?? $code;
}
?>
```

### الآن استخدم الدالة `renderProductCard` في كل مكان يعرض المنتجات

مثال: في `home.php` بدلاً من `generateProductCard` استخدم:

```php
<?php while($product = mysqli_fetch_assoc($featured_products_result)): ?>
    <?php echo renderProductCard($product); ?>
<?php endwhile; ?>
```

ونفس الشيء في `favorites.php` و`search.php` و`categories.php` وأي مكان آخر.

