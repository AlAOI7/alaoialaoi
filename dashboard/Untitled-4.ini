/* تنسيق عام للقوائم */
.sidebar-menu {
    padding: 15px 0;
}

.menu-item {
    display: flex;
    align-items: center;
    padding: 12px 20px;
    color: #333;
    text-decoration: none;
    transition: all 0.3s ease;
    border-right: 3px solid transparent;
    cursor: pointer;
    position: relative;
}

.menu-item:hover,
.menu-item.active {
    background-color: #f5f5f5;
    border-right-color: #007bff;
    color: #007bff;
}

.menu-item i {
    width: 25px;
    text-align: center;
    margin-left: 10px;
    font-size: 18px;
}

.menu-item span {
    flex-grow: 1;
    font-size: 14px;
}

.dropdown-icon {
    font-size: 12px;
    transition: transform 0.3s ease;
}

.menu-item.dropdown.active .dropdown-icon {
    transform: rotate(180deg);
}

/* تنسيق القوائم الفرعية */
.submenu {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    background-color: #f9f9f9;
}

.menu-item.dropdown.active .submenu {
    max-height: 500px;
}

.submenu-item {
    display: flex;
    align-items: center;
    padding: 10px 20px 10px 50px;
    color: #666;
    text-decoration: none;
    transition: all 0.3s ease;
    font-size: 13px;
}

.submenu-item:hover {
    background-color: #e9ecef;
    color: #007bff;
    padding-right: 25px;
}

.submenu-item i {
    font-size: 14px;
    margin-left: 8px;
}

/* تنسيق اللوجو */
.logo {
    text-align: center;
    padding: 20px 10px;
    border-bottom: 1px solid #eee;
    margin-bottom: 10px;
}

.logo h1 {
    font-size: 20px;
    margin-bottom: 5px;
    color: #333;
}

.logo p {
    font-size: 12px;
    color: #666;
}

/* تنسيق الشريط الجانبي */
.sidebar {
    width: 250px;
    background-color: #fff;
    box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    height: 100vh;
    position: fixed;
    right: 0;
    top: 0;
    overflow-y: auto;
}

document.addEventListener('DOMContentLoaded', function() {
    const dropdownItems = document.querySelectorAll('.menu-item.dropdown');
    
    dropdownItems.forEach(item => {
        item.addEventListener('click', function(e) {
            if (!e.target.classList.contains('submenu-item')) {
                e.preventDefault();
                this.classList.toggle('active');
                
                // إغلاق القوائم الأخرى
                dropdownItems.forEach(otherItem => {
                    if (otherItem !== this) {
                        otherItem.classList.remove('active');
                    }
                });
            }
        });
    });
    
    // إضافة active للرابط الحالي
    const currentPage = window.location.pathname.split('/').pop();
    const menuLinks = document.querySelectorAll('.menu-item, .submenu-item');
    
    menuLinks.forEach(link => {
        const href = link.getAttribute('href');
        if (href && href.includes(currentPage)) {
            link.classList.add('active');
            
            // فتح القائمة الأم إذا كان رابط فرعي
            const parentDropdown = link.closest('.menu-item.dropdown');
            if (parentDropdown) {
                parentDropdown.classList.add('active');
            }
        }
    });
});