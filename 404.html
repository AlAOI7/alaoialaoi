<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - الصفحة غير موجودة</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }
        /* خلفية متحركة بالنجوم */
        
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }
        
        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }
        /* كرة تطفو في الخلفية */
        
        .floating-circle {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: -100px;
            right: -100px;
            animation: float 6s ease-in-out infinite;
        }
        
        .floating-circle2 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            bottom: -150px;
            left: -150px;
            animation: float2 8s ease-in-out infinite;
        }
        
        @keyframes float {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-30px) rotate(10deg);
            }
        }
        
        @keyframes float2 {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(30px) rotate(-10deg);
            }
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            z-index: 10;
            max-width: 600px;
            margin: 20px;
            animation: containerAppear 0.8s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        @keyframes containerAppear {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(50px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        /* الأرقام 404 المتحركة */
        
        .error-number {
            font-size: 180px;
            font-weight: 700;
            color: #667eea;
            line-height: 1;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        .digit {
            display: inline-block;
            animation: bounce 2s infinite;
            text-shadow: 5px 5px 0 rgba(102, 126, 234, 0.3);
        }
        
        .digit:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .digit:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        /* أيقونة البحث المتحركة */
        
        .search-icon {
            font-size: 60px;
            color: #764ba2;
            margin-bottom: 20px;
            animation: spin 4s linear infinite;
        }
        
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        
        h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        .message {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .server-info {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9eef5 100%);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 30px;
            font-size: 14px;
            color: #555;
            border: 1px solid rgba(102, 126, 234, 0.2);
            animation: glow 2s infinite;
        }
        
        @keyframes glow {
            0%,
            100% {
                box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
            }
            50% {
                box-shadow: 0 0 20px rgba(102, 126, 234, 0.4);
            }
        }
        
        .server-info p {
            margin: 5px 0;
        }
        
        .server-info i {
            color: #667eea;
            margin-left: 8px;
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Cairo', sans-serif;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .btn-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        /* الشريط المتحرك */
        
        .moving-strip {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, transparent, #667eea, #764ba2, transparent);
            animation: move 2s linear infinite;
        }
        
        @keyframes move {
            from {
                transform: translateX(-100%);
            }
            to {
                transform: translateX(100%);
            }
        }
        /* تصميم متجاوب */
        
        @media (max-width: 768px) {
            .container {
                padding: 30px;
                margin: 15px;
            }
            .error-number {
                font-size: 120px;
            }
            h1 {
                font-size: 28px;
            }
            .message {
                font-size: 16px;
            }
            .btn {
                padding: 12px 24px;
                font-size: 14px;
            }
        }
    </style>
    <!-- Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- خلفية متحركة -->
    <div class="stars" id="stars"></div>
    <div class="floating-circle"></div>
    <div class="floating-circle2"></div>

    <!-- المحتوى الرئيسي -->
    <div class="container">
        <!-- أيقونة البحث -->
        <div class="search-icon">
            <i class="fas fa-search"></i>
        </div>

        <!-- رقم 404 المتحرك -->
        <div class="error-number">
            <span class="digit">4</span>
            <span class="digit">0</span>
            <span class="digit">4</span>
        </div>

        <!-- العنوان -->
        <h1>
            <i class="fas fa-exclamation-triangle" style="color: #ff6b6b; margin-left: 10px;"></i> الصفحة غير موجودة
        </h1>

        <!-- رسالة الخطأ -->
        <div class="message">
            <p>عذراً، الصفحة التي تبحث عنها غير موجودة أو تم نقلها.</p>
            <p style="font-size: 16px; margin-top: 10px;">يمكنك العودة للصفحة الرئيسية أو التحقق من الرابط.</p>
        </div>

        <!-- معلومات السيرفر (مطابقة للرسالة الأصلية) -->
        <div class="server-info">
            <p>
                <i class="fas fa-server"></i>
                <strong>الخادم:</strong> Apache/2.4.58 (Win64) OpenSSL/3.1.3 PHP/8.2.12
            </p>
            <p>
                <i class="fas fa-network-wired"></i>
                <strong>المضيف:</strong> localhost
            </p>
            <p>
                <i class="fas fa-plug"></i>
                <strong>المنفذ:</strong> 80
            </p>
            <p>
                <i class="fas fa-clock"></i>
                <strong>الوقت:</strong> <span id="current-time"></span>
            </p>
        </div>

        <!-- أزرار الإجراء -->
        <div class="buttons">
            <a href="home.php" class="btn btn-primary">
                <i class="fas fa-home"></i> العودة للرئيسية
            </a>
            <a href="javascript:history.back()" class="btn btn-secondary">
                <i class="fas fa-arrow-right"></i> الصفحة السابقة
            </a>
        </div>

        <!-- شريط متحرك سفلي -->
        <div class="moving-strip"></div>
    </div>

    <script>
        // إنشاء النجوم في الخلفية
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        // تحديث الوقت الحالي
        function updateTime() {
            const timeElement = document.getElementById('current-time');
            const now = new Date();
            const options = {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false,
                timeZone: 'Asia/Riyadh'
            };
            timeElement.textContent = now.toLocaleString('ar-SA', options);
        }

        // تفعيل المؤثرات
        createStars();
        updateTime();
        setInterval(updateTime, 1000);

        // تأثير حركة إضافي عند تحريك الماوس
        document.addEventListener('mousemove', (e) => {
            const container = document.querySelector('.container');
            const x = (window.innerWidth / 2 - e.pageX) / 30;
            const y = (window.innerHeight / 2 - e.pageY) / 30;
            container.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body>

</html>
